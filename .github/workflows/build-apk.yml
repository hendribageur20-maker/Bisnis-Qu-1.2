name: Build & Package Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-android:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      # 2. Setup Node.js 22 LTS
      - name: 2. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Setup Java JDK 21 (Temurin)
      - name: 3. Setup Java JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 4. Setup Android SDK Platform 35
      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # 5. Prepare environment and debug keystore
      - name: 5. Prepare environment and debug keystore
        run: |
          # Siapkan .env
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

          # Buat debug keystore jika belum ada
          mkdir -p ~/.android
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            cp debug.keystore ~/.android/debug.keystore 2>/dev/null || true
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            cp debug.keystore ~/.android/debug.keystore 2>/dev/null || true
          fi

      # 6. Install Dependencies & Build Web App
      - name: 6. Install Dependencies & Build Web App
        run: |
          npm install --legacy-peer-deps
          npm run build

      # 7. Inisialisasi & Sinkronisasi Platform Android
      - name: 7. Inisialisasi & Sinkronisasi Platform Android
        run: |
          # Inisialisasi platform android jika belum ada
          if [ ! -f "android/gradlew" ]; then
            echo "Membuat platform android native via Capacitor..."
            rm -rf android
            npx cap add android
          fi

          echo "Menyinkronkan aset web ke Android..."
          npx cap sync android

          # Konfigurasi variables.gradle ke SDK 35 yang kompatibel
          cat << 'EOF' > android/variables.gradle
          ext {
              minSdkVersion = 24
              compileSdkVersion = 35
              targetSdkVersion = 35
              androidxActivityVersion = '1.9.3'
              androidxAppCompatVersion = '1.7.0'
              androidxCoordinatorLayoutVersion = '1.2.0'
              androidxCoreVersion = '1.15.0'
              androidxFragmentVersion = '1.8.5'
              coreSplashScreenVersion = '1.0.1'
              androidxWebkitVersion = '1.12.1'
              junitVersion = '4.13.2'
              androidxJunitVersion = '1.2.1'
              androidxEspressoCoreVersion = '3.6.1'
              cordovaAndroidVersion = '14.0.1'
          }
          EOF

          # Konfigurasi gradle.properties optimal untuk CI
          cat << 'EOF' > android/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          org.gradle.daemon=false
          org.gradle.parallel=false
          android.useAndroidX=true
          android.enableJetifier=true
          android.builder.sdkDownload=true
          EOF

          # Beri izin eksekusi gradlew di root dan di folder android
          chmod +x android/gradlew 2>/dev/null || true
          chmod +x gradlew 2>/dev/null || true

      # 8. Build APK with Gradle (Skipping tests & lint untuk kecepatan & keandalan)
      - name: 8. Build APK with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace -x test -x lint
          else
            cd android
            ./gradlew assembleDebug --no-daemon --stacktrace -x test -x lint
            cd ..
          fi

      # 9. Siapkan File APK
      - name: 9. Siapkan File APK
        run: |
          mkdir -p output-apk
          APK_FILE=$(find . -type f -name "*debug.apk" -o -name "*.apk" | grep -v "node_modules" | head -n 1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" output-apk/BisnisQu-1.0.apk
            echo "APK Berhasil dibuat di output-apk/BisnisQu-1.0.apk (Sumber: $APK_FILE)"
            ls -lh output-apk/
          else
            echo "ERROR: File APK tidak ditemukan di build outputs!"
            find . -name "*.apk" || true
            exit 1
          fi

      # 10. Upload APK Artifact
      - name: 10. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BisnisQu-1.0-APK
          path: output-apk/BisnisQu-1.0.apk
          retention-days: 30
